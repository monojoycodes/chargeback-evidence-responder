[project]
name = "chargeback-evidence-responder"
version = "0.1.0"
description = "Synthetic chargeback evidence generator and responder"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.9.0",
    "xgboost>=3.2.0",
    "shap>=0.46.0,<0.50",
    "matplotlib>=3.9.0",
    "joblib>=1.4.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.2.0",
    "pypdf>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false
